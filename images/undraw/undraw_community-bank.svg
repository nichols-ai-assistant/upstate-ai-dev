<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img">
  <!-- Steps (full width, prominent) -->
  <rect x="50" y="262" width="380" height="8" rx="2" fill="#d6dce6"/>
  <rect x="40" y="270" width="400" height="8" rx="2" fill="#ccc"/>
  <rect x="30" y="278" width="420" height="10" rx="3" fill="#e6e6e6"/>

  <!-- Base platform -->
  <rect x="60" y="250" width="360" height="16" rx="2" fill="#3f3d56"/>

  <!-- Building body -->
  <rect x="70" y="130" width="340" height="120" rx="0" fill="#f2f2f2"/>

  <!-- Tall narrow openings (between columns — institutional style) -->
  <rect x="110" y="150" width="20" height="70" rx="2" fill="#3f3d56"/>
  <rect x="113" y="153" width="14" height="64" rx="1.5" fill="#d6dce6"/>

  <rect x="160" y="150" width="20" height="70" rx="2" fill="#3f3d56"/>
  <rect x="163" y="153" width="14" height="64" rx="1.5" fill="#d6dce6"/>

  <rect x="300" y="150" width="20" height="70" rx="2" fill="#3f3d56"/>
  <rect x="303" y="153" width="14" height="64" rx="1.5" fill="#d6dce6"/>

  <rect x="350" y="150" width="20" height="70" rx="2" fill="#3f3d56"/>
  <rect x="353" y="153" width="14" height="64" rx="1.5" fill="#d6dce6"/>

  <!-- Center door (wider, arched top feel) -->
  <rect x="218" y="170" width="44" height="80" rx="4" fill="#3f3d56"/>
  <rect x="222" y="174" width="36" height="76" rx="3" fill="#FF6B07"/>
  <line x1="240" y1="174" x2="240" y2="250" stroke="#3f3d56" stroke-width="1.5" opacity="0.3"/>
  <circle cx="250" cy="215" r="2.5" fill="#3f3d56"/>

  <!-- 6 Columns -->
  <rect x="82" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>
  <rect x="140" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>
  <rect x="198" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>
  <rect x="270" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>
  <rect x="328" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>
  <rect x="386" y="130" width="12" height="120" rx="2" fill="#e6e6e6" stroke="#3f3d56" stroke-width="1"/>

  <!-- Column capitals -->
  <rect x="78" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>
  <rect x="136" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>
  <rect x="194" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>
  <rect x="266" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>
  <rect x="324" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>
  <rect x="382" y="125" width="20" height="8" rx="2" fill="#3f3d56"/>

  <!-- Column bases -->
  <rect x="78" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>
  <rect x="136" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>
  <rect x="194" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>
  <rect x="266" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>
  <rect x="324" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>
  <rect x="382" y="247" width="20" height="5" rx="1.5" fill="#3f3d56"/>

  <!-- Entablature (wide horizontal band) -->
  <rect x="60" y="112" width="360" height="16" rx="2" fill="#3f3d56"/>
  <rect x="65" y="108" width="350" height="6" rx="1" fill="#3f3d56" opacity="0.6"/>

  <!-- Pediment (shallow triangle — institutional) -->
  <polygon points="240,55 55,108 425,108" fill="#FF6B07"/>
  <polygon points="240,68 72,105 408,105" fill="#f2f2f2"/>

  <!-- Decorative frieze line -->
  <line x1="100" y1="88" x2="380" y2="88" stroke="#3f3d56" stroke-width="1" opacity="0.2"/>
</svg>