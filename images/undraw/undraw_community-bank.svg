<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img">
  <!-- ====== STEPS (flat, simple, full width) ====== -->
  <rect x="110" y="472" width="580" height="10" rx="3" fill="#e6e6e6"/>
  <rect x="90" y="484" width="620" height="10" rx="3" fill="#ddd"/>
  <rect x="70" y="496" width="660" height="12" rx="3" fill="#d4d4d4"/>

  <!-- ====== BASE PLATFORM ====== -->
  <rect x="130" y="458" width="540" height="18" rx="3" fill="#3f3d56"/>

  <!-- ====== BUILDING BODY ====== -->
  <rect x="145" y="190" width="510" height="268" fill="#f2f2f2"/>

  <!-- ====== TALL ARCHED WINDOWS (simple, flat) ====== -->
  <!-- Window 1 -->
  <rect x="200" y="240" width="24" height="65" rx="12" fill="#3f3d56"/>
  <rect x="203" y="243" width="18" height="59" rx="9" fill="#e6e6e6"/>

  <!-- Window 2 -->
  <rect x="280" y="240" width="24" height="65" rx="12" fill="#3f3d56"/>
  <rect x="283" y="243" width="18" height="59" rx="9" fill="#e6e6e6"/>

  <!-- Window 3 -->
  <rect x="496" y="240" width="24" height="65" rx="12" fill="#3f3d56"/>
  <rect x="499" y="243" width="18" height="59" rx="9" fill="#e6e6e6"/>

  <!-- Window 4 -->
  <rect x="576" y="240" width="24" height="65" rx="12" fill="#3f3d56"/>
  <rect x="579" y="243" width="18" height="59" rx="9" fill="#e6e6e6"/>

  <!-- ====== CENTRAL DOOR ====== -->
  <rect x="370" y="310" width="60" height="148" rx="4" fill="#3f3d56"/>
  <rect x="374" y="314" width="24" height="140" rx="2" fill="#FF6B07"/>
  <rect x="402" y="314" width="24" height="140" rx="2" fill="#FF6B07"/>
  <!-- Fanlight -->
  <circle cx="400" cy="310" r="30" fill="#3f3d56"/>
  <circle cx="400" cy="310" r="26" fill="#e6e6e6"/>
  <rect x="370" y="310" width="60" height="30" fill="#f2f2f2"/>
  <!-- Door handles -->
  <circle cx="396" cy="390" r="2.5" fill="#3f3d56"/>
  <circle cx="404" cy="390" r="2.5" fill="#3f3d56"/>

  <!-- ====== 6 COLUMNS (simple flat rectangles, Undraw style) ====== -->
  <rect x="162" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="252" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="342" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="428" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="518" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="608" y="190" width="30" height="268" rx="4" fill="#e6e6e6" stroke="#d4d4d4" stroke-width="1"/>

  <!-- ====== COLUMN CAPITALS (simple wide caps) ====== -->
  <rect x="155" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>
  <rect x="245" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>
  <rect x="335" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>
  <rect x="421" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>
  <rect x="511" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>
  <rect x="601" y="183" width="44" height="10" rx="3" fill="#3f3d56"/>

  <!-- ====== COLUMN BASES ====== -->
  <rect x="155" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>
  <rect x="245" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>
  <rect x="335" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>
  <rect x="421" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>
  <rect x="511" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>
  <rect x="601" y="455" width="44" height="6" rx="2" fill="#3f3d56"/>

  <!-- ====== ENTABLATURE (simple, clean) ====== -->
  <rect x="130" y="168" width="540" height="18" rx="2" fill="#3f3d56"/>

  <!-- ====== PEDIMENT (shallow, flat triangle) ====== -->
  <polygon points="400,65 125,168 675,168" fill="#FF6B07"/>
  <polygon points="400,82 145,164 655,164" fill="#f2f2f2"/>

  <!-- ====== CLOCK (simple, minimal) ====== -->
  <circle cx="400" cy="125" r="24" fill="#fff" stroke="#3f3d56" stroke-width="2.5"/>
  <!-- Hour markers (just 4) -->
  <line x1="400" y1="105" x2="400" y2="109" stroke="#3f3d56" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="141" x2="400" y2="145" stroke="#3f3d56" stroke-width="2" stroke-linecap="round"/>
  <line x1="380" y1="125" x2="384" y2="125" stroke="#3f3d56" stroke-width="2" stroke-linecap="round"/>
  <line x1="416" y1="125" x2="420" y2="125" stroke="#3f3d56" stroke-width="2" stroke-linecap="round"/>
  <!-- Hands -->
  <line x1="400" y1="125" x2="400" y2="110" stroke="#3f3d56" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="125" x2="411" y2="120" stroke="#FF6B07" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="125" r="2.5" fill="#3f3d56"/>

  <!-- ====== PERSON (Undraw-style, for scale and warmth) ====== -->
  <!-- Head -->
  <circle cx="710" cy="430" r="14" fill="#3f3d56"/>
  <!-- Body -->
  <rect x="702" y="444" width="16" height="28" rx="6" fill="#FF6B07"/>
  <!-- Legs -->
  <rect x="704" y="470" width="6" height="22" rx="3" fill="#3f3d56"/>
  <rect x="714" y="470" width="6" height="22" rx="3" fill="#3f3d56"/>
  <!-- Arm -->
  <rect x="695" y="448" width="10" height="5" rx="2.5" fill="#3f3d56"/>
  <!-- Briefcase -->
  <rect x="680" y="448" width="16" height="12" rx="2" fill="#3f3d56"/>
  <rect x="685" y="445" width="6" height="5" rx="2" fill="none" stroke="#3f3d56" stroke-width="1.5"/>
</svg>