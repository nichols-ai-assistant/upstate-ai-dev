<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img">
  <!-- Base/Ground -->
  <rect x="40" y="310" width="320" height="12" rx="4" fill="#e6e6e6"/>
  <rect x="60" y="298" width="280" height="16" rx="3" fill="#3f3d56"/>

  <!-- Building body -->
  <rect x="80" y="140" width="240" height="158" rx="2" fill="#f2f2f2"/>

  <!-- Door -->
  <rect x="170" y="220" width="60" height="78" rx="4" fill="#3f3d56"/>
  <rect x="175" y="225" width="50" height="73" rx="3" fill="#FF6B07"/>
  <circle cx="215" cy="262" r="3" fill="#3f3d56"/>

  <!-- Windows row 1 -->
  <rect x="100" y="170" width="40" height="50" rx="3" fill="#3f3d56"/>
  <rect x="104" y="174" width="32" height="42" rx="2" fill="#d6dce6"/>
  <line x1="120" y1="174" x2="120" y2="216" stroke="#3f3d56" stroke-width="1.5"/>
  <line x1="104" y1="195" x2="136" y2="195" stroke="#3f3d56" stroke-width="1.5"/>

  <rect x="260" y="170" width="40" height="50" rx="3" fill="#3f3d56"/>
  <rect x="264" y="174" width="32" height="42" rx="2" fill="#d6dce6"/>
  <line x1="280" y1="174" x2="280" y2="216" stroke="#3f3d56" stroke-width="1.5"/>
  <line x1="264" y1="195" x2="296" y2="195" stroke="#3f3d56" stroke-width="1.5"/>

  <!-- Windows row 2 -->
  <rect x="100" y="240" width="40" height="40" rx="3" fill="#3f3d56"/>
  <rect x="104" y="244" width="32" height="32" rx="2" fill="#d6dce6"/>
  <line x1="120" y1="244" x2="120" y2="276" stroke="#3f3d56" stroke-width="1.5"/>
